<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>angelversary</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <style>
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }
      body {
        min-height: 100vh;

        background-image: url("doors/back.jpg");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      .door-container {
        display: flex;
        justify-content: space-evenly;
        align-items: flex-end;
        
        position: absolute;
        left: 0;
        bottom: 12vh;

        width: 100%;
        height: 78vh;

        padding: 0 2%;
        box-sizing: border-box;
      }

      .door-container a {
        display: flex;
        justify-content: center;
        align-items: flex-end;

        height: 100%;
        /* max-width: 30%; */
      }

      .door-container img {
        display: block;
        object-fit: contain;
        width: auto;
        max-width: 100%;
      }
      .door1{
        height: clamp(300px, 78vh, 620px); 
      }
      .door2{
        height: clamp(300px, 60vh, 620px); 
      }
      .door3{
        height: clamp(300px, 80vh, 620px); 
      }
      .door1:hover {
        content: url('doors/door1.png');
      }
      .door2:hover {
        content: url('doors/door2.png');
      }
      .door3:hover {
        content: url('doors/door3.png');
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center;">Happy seven years</h1>
    
    <div class="door-container">
      <a href="/natural-history.html"><img class="door1" src="doors/door1closed.png" alt=""></a>
      <a href="/air-and-space.html"><img class="door2" src="doors/door2closed.png" alt=""></a>
      <a href="/art.html"><img class="door3" src="doors/door3closed.png" alt=""></a>
    </div>
    

  </body>
</html>
